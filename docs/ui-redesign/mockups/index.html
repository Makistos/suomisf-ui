<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book and short story index mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css">
<style>
:root{
  --page:#F3F4F8; --surface:#FFFFFF; --ink:#1E2233; --muted:#5D6377; --faint:#8A90A3;
  --rule:#E3E6EE; --primary:#3F51B5; --primary-soft:#E8EBF8; --primary-ink:#2D3A8C;
  --sf:#0958D7; --f:#31572C; --k:#D30031; --kok:#008B8B; --other:#6C757D;
  --primary-ink:#2D3A8C; --primary-line:#CDD3F0; --on-primary:#fff; --on-ink:#fff; --tag-bg:#FAFBFD; --ph:#E3E6EE; --ph-line:#D3D7E2; --hover-line:#C9CEE0; --hover-bg:#F8F9FC; --admin-bg:#F7F8FB; --warn-bg:#FFF8E6; --warn-ink:#6B5310; --gold-soft:#FBF3DC; --gold-line:#EBD9A5; --gold-ink:#4A3A0A; --gold-icon:#8A6A12; --star-off:#C9CEDB; --ok:#2E7D4F; --mock-bg:#FFF7D6; --mock-ink:#5A4B0F; --mock-line:#D9C56B; --mock-note:#8A7A3A; --mock-on:#fff; --outline:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--page:#121212; --surface:#1e1e1e; --ink:#dedede; --muted:#9e9e9e; --faint:#7c7c7c; --rule:#333333; --primary:#9FA8DA; --primary-soft:#2a2d3c; --primary-ink:#c5cae9; --primary-line:#3d4260; --on-primary:#121212; --on-ink:#121212; --tag-bg:#262626; --ph:#2c2c2c; --ph-line:#444444; --hover-line:#4a4a4a; --hover-bg:#262626; --admin-bg:#181818; --warn-bg:#3a3112; --warn-ink:#f0d78c; --gold-soft:#332a10; --gold-line:#6b5a22; --gold-ink:#f0d78c; --gold-icon:#e0c060; --star-off:#4a4a4a; --ok:#81c784; --mock-bg:#3a3412; --mock-ink:#f0e2a0; --mock-line:#7a6a1a; --mock-note:#c9b870; --mock-on:#3a3412; --outline:rgba(255,255,255,.28);}}
:root[data-theme=dark]{--page:#121212; --surface:#1e1e1e; --ink:#dedede; --muted:#9e9e9e; --faint:#7c7c7c; --rule:#333333; --primary:#9FA8DA; --primary-soft:#2a2d3c; --primary-ink:#c5cae9; --primary-line:#3d4260; --on-primary:#121212; --on-ink:#121212; --tag-bg:#262626; --ph:#2c2c2c; --ph-line:#444444; --hover-line:#4a4a4a; --hover-bg:#262626; --admin-bg:#181818; --warn-bg:#3a3112; --warn-ink:#f0d78c; --gold-soft:#332a10; --gold-line:#6b5a22; --gold-ink:#f0d78c; --gold-icon:#e0c060; --star-off:#4a4a4a; --ok:#81c784; --mock-bg:#3a3412; --mock-ink:#f0e2a0; --mock-line:#7a6a1a; --mock-note:#c9b870; --mock-on:#3a3412; --outline:rgba(255,255,255,.28);}
.seg,.gbar .t i,.gchip i,.legend i{box-shadow:inset 0 0 0 1px var(--outline)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 Roboto,system-ui,sans-serif}
a{color:var(--primary);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.viewas{background:var(--mock-bg);border-bottom:1px dashed var(--mock-line);font-size:13px;color:var(--mock-ink)}
.viewas .wrap{display:flex;gap:10px;align-items:center;min-height:36px;flex-wrap:wrap}
.viewas span.opt{padding:2px 10px;border-radius:999px;cursor:pointer}
.viewas span.opt.on{background:var(--mock-ink);color:var(--mock-on)}
.nav{background:var(--surface);border-bottom:1px solid var(--rule)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:60px}
.brand{font:700 19px 'Roboto Slab',serif;color:var(--primary)}
.nav a.m{color:var(--ink);font-size:15px}
.nav a.m.cur{color:var(--primary);font-weight:500}
.navsearch{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:6px 12px;width:300px;color:var(--faint);font-size:14px}
.navsearch label{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.rel{position:relative}
.anno{position:absolute;background:#FFE57A;color:#3a3000;font:600 12px Roboto;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:4}
.crumbs{font-size:13px;color:var(--faint);padding:18px 0 4px}
h1{font:600 32px/1.2 'Roboto Slab',serif;margin:6px 0 4px}
.lead{color:var(--muted);margin:0 0 18px}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field > span{font-size:12.5px;color:var(--muted)}
.box{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:14.5px;color:var(--ink);background:var(--surface);min-height:40px;display:flex;align-items:center;gap:8px}
.box.ph{color:var(--faint)}
.box .caret{margin-left:auto;color:var(--faint);font-size:12px}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.range i{color:var(--faint);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lab{font-size:12.5px;color:var(--muted);margin-right:4px;min-width:64px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip i.dot{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px var(--outline)}
.letters{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.letters .lab{font-size:12.5px;color:var(--muted);margin-right:8px}
.letters a{min-width:24px;text-align:center;padding:2px 0;border-radius:6px;font-size:13.5px;color:var(--muted)}
.letters a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.btn{border:0;background:var(--primary);color:var(--on-primary);font:500 15px Roboto;padding:9px 22px;border-radius:8px}
.toggle-sw{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.sw{width:34px;height:20px;border-radius:999px;background:var(--rule);position:relative;display:inline-block}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 8px;flex-wrap:wrap}
.bar .count{font:600 18px 'Roboto Slab',serif}
.bar .count small{font:400 14px Roboto;color:var(--muted);margin-left:8px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.select{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13.5px;color:var(--ink);white-space:nowrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg span{padding:6px 11px;font-size:13px;color:var(--muted);border-left:1px solid var(--rule)}
.seg span:first-child{border-left:0}
.seg span.on{background:var(--primary-soft);color:var(--primary);font-weight:500}
.urlbox{font:12.5px ui-monospace,monospace;color:var(--muted);background:var(--surface);border:1px dashed var(--rule);border-radius:8px;padding:6px 10px;margin:4px 0 12px;overflow:auto;white-space:nowrap}
.group{font:600 16px 'Roboto Slab',serif;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:10px}
.group::after{content:"";flex:1;height:1px;background:var(--rule)}
.rows{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 14px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row:hover{background:var(--hover-bg)}
.th{width:40px;height:58px;border-radius:3px;background:var(--ph);display:grid;place-items:center;color:var(--faint);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.th img{width:100%;height:100%;object-fit:cover}
.th.sm{width:30px;height:30px;border-radius:50%;box-shadow:none}
.t{font-weight:600}
.t a{color:var(--ink)}
.s{font-size:13.5px;color:var(--muted)}
.s b{font-weight:500;color:var(--ink)}
.right{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.g{font-size:11.5px;font-weight:600;border-radius:4px;padding:2px 6px;color:#fff}
.k{font-size:12.5px;color:var(--faint);white-space:nowrap}
.award{font-size:12px;color:var(--gold-ink);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.who{font-size:11.5px;color:var(--primary-ink);background:var(--primary-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 60px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.pages{display:flex;gap:4px}
.pages a,.pages span{min-width:34px;text-align:center;padding:5px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.pages a.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.pages span{border:0;background:none;color:var(--faint)}
.morelink{display:none;font-size:14px}
.r-user,.r-admin{display:none}
body.user .r-user, body.admin .r-user, body.admin .r-admin{display:inline}
body.user .r-anon, body.admin .r-anon{display:none}

@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .nav a.m{display:none}
  .navsearch{width:auto;flex:1}
  h1{font-size:24px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .letters{flex-wrap:nowrap;overflow-x:auto}
  .row{grid-template-columns:34px minmax(0,1fr);gap:10px}
  .th{width:34px;height:50px}
  .right{grid-column:2;justify-content:flex-start}
  .anno{display:none}
  .viewas em{display:none}
  .panel .more{display:none}
  .panel.open .more{display:flex}
  .panel .morelink{display:block}
}
</style>
</head>
<body>
<div class="viewas"><div class="wrap">Mockup:
  <span class="opt" data-k="books">Kirjat (haku "Le Guin")</span><span class="opt" data-k="shorts">Novellit (henkilö "Sinisalo")</span>
  <span style="margin-left:10px">Teema:</span><span class="opt thm" data-th="light">Vaalea</span><span class="opt thm" data-th="dark">Tumma</span>
  <em style="margin-left:auto;color:var(--mock-note)">Hakutulokset oikeita (22.11.2026)</em></div></div>
<header class="nav"><div class="wrap">
  <span class="brand">SuomiSF</span>
  <a class="m" id="nk">Kirjat</a><a class="m">Lehdet</a><a class="m" id="nn">Novellit</a>
  <a class="m r-anon">Hakemistot ▾</a>
  <a class="m r-anon"><i class="pi pi-user"></i> Käyttäjätili ▾</a>
  <div class="navsearch"><i class="pi pi-search"></i>Etsi<label><input type="checkbox" checked> Vain nimet</label></div>
</div></header>
<div class="wrap" id="app"></div>

<script src="index-data.js"></script>
<script>
const IMG="https://www.sf-bibliografia.fi:5000";
const Q=new URLSearchParams(location.search);
const K=Q.get("k")==="shorts"?"shorts":"books";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=n=>n.toLocaleString("fi-FI");
const fin=n=>(n||"").split(" & ").map(p=>p.includes(", ")?p.split(", ").reverse().join(" "):p).join(" & ");
const GENRE_COLOR={"Science Fiction":"#0958D7","Fantasia":"#31572C","Kauhu":"#D30031","Kokoelma":"#008B8B","Ei SpeFiä":"#6C757D","Nuorten fantasia":"#21D011","Nuorten Science Fiction":"#4A90D9","Nuorten kauhu":"#FF696D","Lasten fantasia":"#82C341","Lasten Science Fiction":"#7EC8E3","Vaihtoehtohistoria":"#E67E22","Utopia":"#DAA520","Satu":"#E91E63","Paleofiktio":"#9B59B6","Poliittinen fiktio":"#7B2D8E"};
const ABBR={"Science Fiction":"SF","Fantasia":"F","Kauhu":"K","Kokoelma":"kok","Ei SpeFiä":"ei spefiä"};
const GENRES=["Science Fiction","Fantasia","Kauhu","Nuorten Science Fiction","Nuorten fantasia","Nuorten kauhu","Lasten Science Fiction","Lasten fantasia","Vaihtoehtohistoria","Utopia","Poliittinen fiktio","Paleofiktio","Satu","Kokoelma","Ei SpeFiä"];
const WTYPES=["Romaani","Kokoelma","Kokoomateos","Sarjakuva","Vihko","Tietokirja"];
const STYPES=["Novelli","Pitkä novelli","Pienoisromaani","Raapale","Runo","Filk-laulu","Artikkeli","Esipuhe","Jälkisanat"];
document.getElementById(K==="books"?"nk":"nn").classList.add("cur");
const L="ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ".split("");

function booksPage(){
  const W=IDX.works;
  return `<div class="crumbs">Kirjat</div>
  <section class="rel"><span class="anno" style="left:-34px;top:12px">1</span><h1>Kirjat</h1>
  <p class="lead">Kaikki bibliografian 7 313 teosta. Rajaa tekijän, nimen, vuoden, genren tai tyypin mukaan; ilman rajauksia näet kaikki tekijän mukaan.</p></section>
  <section class="panel rel"><span class="anno" style="left:-50px;top:14px">2</span>
    <div class="grid">
      <label class="field"><span>Tekijä</span><span class="box"><i class="pi pi-user" style="color:var(--faint)"></i>Le Guin</span></label>
      <label class="field"><span>Nimi</span><span class="box ph">Suomenkielinen nimi</span></label>
      <label class="field more"><span>Alkuperäinen nimi</span><span class="box ph">Esim. The Dispossessed</span></label>
      <div class="field more"><span>Alkuteos julkaistu</span><span class="range"><span class="box ph">vuodesta</span><i>–</i><span class="box ph">vuoteen</span></span></div>
      <div class="field more"><span>Painettu</span><span class="range"><span class="box ph">vuodesta</span><i>–</i><span class="box ph">vuoteen</span></span></div>
      <label class="field more"><span>Tekijän kansallisuus</span><span class="box ph">Kaikki<span class="caret">▾</span></span></label>
    </div>
    <div class="chips more"><span class="lab">Tyyppi</span><span class="chip on">Kaikki</span>${WTYPES.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="chips more"><span class="lab">Genre</span>${GENRES.map(g=>`<span class="chip"><i class="dot" style="background:${GENRE_COLOR[g]}"></i>${g}</span>`).join("")}</div>
    <div class="letters rel more"><span class="anno" style="left:-50px;top:-2px">3</span><span class="lab">Tekijän sukunimi alkaa</span><a class="on">Kaikki</a>${L.map(c=>`<a>${c}</a>`).join("")}</div>
    <a class="morelink" onclick="this.closest('.panel').classList.add('open');this.remove()">Lisää rajauksia: vuodet, kansallisuus, tyyppi, genre</a>
    <div class="actions"><a>Tyhjennä rajaukset</a><button class="btn">Hae</button></div>
  </section>
  <div class="bar rel"><span class="anno" style="left:-34px;top:2px">4</span><span class="count">${W.length} teosta<small>tekijä "Le Guin"</small></span>
    <span class="tools"><span class="select">Järjestys: tekijä, nimi ▾</span><span class="toggle-sw"><span class="sw" style="background:var(--primary)"></span>Ryhmittele tekijöittäin</span>
    <span class="seg"><span class="on">Lista</span><span>Kannet</span></span><a><i class="pi pi-chart-bar"></i> Tilastot tästä hausta</a></span></div>
  <div class="urlbox">/bookindex?tekija=le+guin&amp;sivu=1</div>
  <div class="rel"><span class="anno" style="left:-34px;top:20px">5</span>
  ${groupBy(W,w=>fin(w.au)).map(([au,list])=>`<div class="group">${esc(au)}<small style="font:400 13px Roboto;color:var(--faint)">${list.length}</small></div>
  <div class="rows">${list.map(w=>`<div class="row"><span class="th">${w.img?`<img src="${IMG+w.img}" alt="">`:`<i class="pi pi-book"></i>`}</span>
    <div><div class="t"><a>${esc(w.title)}</a></div>
    <div class="s">${esc(w.orig&&w.orig!==w.title?w.orig+" ":"")}${w.y||""}${w.series?` · <a>${esc(w.series)}${w.sn?" "+esc(w.sn):""}</a>`:""}</div>
    <div class="s">${w.first?`${esc(w.first.p)} ${w.first.y}${w.neds>1?`, ${w.neds} painosta`:""}`:""}</div></div>
    <div class="right">${w.genres.map(g=>`<span class="g" style="background:${GENRE_COLOR[g]||"#6C757D"}">${ABBR[g]||esc(g)}</span>`).join("")}</div></div>`).join("")}</div>`).join("")}</div>
  <div class="pager rel"><span class="anno" style="left:-34px;top:4px">6</span><span>Näytetään 1–${W.length} / ${W.length}</span><span class="select">Rivejä 50 ▾</span></div>`;
}

function shortsPage(){
  const S=IDX.shorts;
  const mine=s=>s.au.some(a=>/Sinisalo/.test(a));
  return `<div class="crumbs">Novellit</div>
  <section class="rel"><span class="anno" style="left:-34px;top:12px">1</span><h1>Novellit</h1>
  <p class="lead">Novellit, runot ja artikkelit kirjoista ja lehdistä. Rajaa henkilön, nimen, vuoden, tyypin tai lehden mukaan.</p></section>
  <section class="panel rel"><span class="anno" style="left:-50px;top:14px">2</span>
    <div class="grid">
      <label class="field"><span>Henkilö</span><span class="box"><i class="pi pi-user" style="color:var(--faint)"></i>Sinisalo</span></label>
      <label class="field"><span>Henkilön rooli</span><span class="box">Kaikki roolit<span class="caret">▾</span></span></label>
      <label class="field more"><span>Nimi</span><span class="box ph">Suomenkielinen nimi</span></label>
      <label class="field more"><span>Alkuperäinen nimi</span><span class="box ph">Esim. The Star</span></label>
      <div class="field more"><span>Julkaistu</span><span class="range"><span class="box ph">vuodesta</span><i>–</i><span class="box ph">vuoteen</span></span></div>
      <label class="field more"><span>Lehti</span><span class="box ph">Kaikki lehdet<span class="caret">▾</span></span></label>
    </div>
    <div class="chips more"><span class="lab">Tyyppi</span><span class="chip on">Kaikki</span>${STYPES.map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <a class="morelink" onclick="this.closest('.panel').classList.add('open');this.remove()">Lisää rajauksia: nimet, vuodet, lehti, tyyppi</a>
    <div class="actions"><span class="toggle-sw" style="margin-right:auto"><span class="sw"></span>Vain palkitut</span><a>Tyhjennä rajaukset</a><button class="btn">Hae</button></div>
  </section>
  <div class="bar rel"><span class="anno" style="left:-34px;top:2px">3</span><span class="count">${nf(IDX.shortsTotal)} novellia ja artikkelia<small>henkilö "Sinisalo", kaikki roolit</small></span>
    <span class="tools"><span class="select">Järjestys: nimi ▾</span><span class="toggle-sw"><span class="sw"></span>Ryhmittele kirjoittajittain</span></span></div>
  <div class="urlbox">/shortstoryindex?henkilo=sinisalo&amp;sivu=1</div>
  <div class="rows rel"><span class="anno" style="left:-34px;top:12px">4</span>${S.slice(0,25).map(s=>{
    const where=[...s.eds.map(e=>`<a>${esc(e.t)}</a> ${e.y}`),...s.iss.map(i=>`<a>${esc(i.m)} ${esc(i.no)}</a>`)];
    return `<div class="row"><span class="th sm"><i class="pi pi-file"></i></span>
    <div><div class="t"><a>${esc(s.title)}</a> <span class="s">${s.au.map(a=>/Sinisalo/.test(a)?`<b>${esc(a)}</b>`:esc(a)).join(", ")}</span></div>
    <div class="s">${where.slice(0,3).join(", ")}${where.length>3?` ja ${where.length-3} muuta`:""}</div></div>
    <div class="right">${mine(s)?"":`<span class="who" title="Sinisalo ei ole kirjoittaja: hän esiintyy tekstissä tai on muussa roolissa">Sinisalo: muu rooli</span>`}${s.aw?`<span class="award"><i class="pi pi-trophy"></i> palkittu</span>`:""}<span class="k">${esc(s.type||"")}${s.y?", "+s.y:""}</span></div></div>`}).join("")}</div>
  <div class="pager rel"><span class="anno" style="left:-34px;top:4px">5</span><span>Näytetään 1–25 / ${nf(IDX.shortsTotal)}</span><span class="pages"><a class="on">1</a><a>2</a><a>3</a><span>…</span><a>${Math.ceil(IDX.shortsTotal/25)}</a><a>›</a></span></div>`;
}
function groupBy(arr,f){const m=new Map();arr.forEach(x=>{const k=f(x);m.set(k,[...(m.get(k)||[]),x])});return [...m.entries()]}

document.getElementById("app").innerHTML=K==="books"?booksPage():shortsPage();
document.querySelectorAll(".viewas .opt[data-k]").forEach(x=>{x.classList.toggle("on",x.dataset.k===K);x.onclick=()=>{const u=new URLSearchParams(location.search);u.set("k",x.dataset.k);location.search=u}});
(()=>{const set=t=>{if(t)document.documentElement.dataset.theme=t;document.querySelectorAll(".viewas .thm").forEach(x=>x.classList.toggle("on",x.dataset.th===document.documentElement.dataset.theme))};
document.querySelectorAll(".viewas .thm").forEach(x=>x.onclick=()=>set(x.dataset.th));set(Q.get("theme"));})();
