<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magazines mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css">
<style>
:root{
  --page:#F3F4F8; --surface:#FFFFFF; --ink:#1E2233; --muted:#5D6377; --faint:#8A90A3;
  --rule:#E3E6EE; --primary:#3F51B5; --primary-soft:#E8EBF8; --primary-ink:#2D3A8C;
  --sf:#0958D7; --f:#31572C; --k:#D30031; --kok:#008B8B; --other:#6C757D;
  --primary-ink:#2D3A8C; --primary-line:#CDD3F0; --on-primary:#fff; --on-ink:#fff; --tag-bg:#FAFBFD; --ph:#E3E6EE; --ph-line:#D3D7E2; --hover-line:#C9CEE0; --hover-bg:#F8F9FC; --admin-bg:#F7F8FB; --warn-bg:#FFF8E6; --warn-ink:#6B5310; --gold-soft:#FBF3DC; --gold-line:#EBD9A5; --gold-ink:#4A3A0A; --gold-icon:#8A6A12; --star-off:#C9CEDB; --ok:#2E7D4F; --mock-bg:#FFF7D6; --mock-ink:#5A4B0F; --mock-line:#D9C56B; --mock-note:#8A7A3A; --mock-on:#fff; --outline:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--page:#121212; --surface:#1e1e1e; --ink:#dedede; --muted:#9e9e9e; --faint:#7c7c7c; --rule:#333333; --primary:#9FA8DA; --primary-soft:#2a2d3c; --primary-ink:#c5cae9; --primary-line:#3d4260; --on-primary:#121212; --on-ink:#121212; --tag-bg:#262626; --ph:#2c2c2c; --ph-line:#444444; --hover-line:#4a4a4a; --hover-bg:#262626; --admin-bg:#181818; --warn-bg:#3a3112; --warn-ink:#f0d78c; --gold-soft:#332a10; --gold-line:#6b5a22; --gold-ink:#f0d78c; --gold-icon:#e0c060; --star-off:#4a4a4a; --ok:#81c784; --mock-bg:#3a3412; --mock-ink:#f0e2a0; --mock-line:#7a6a1a; --mock-note:#c9b870; --mock-on:#3a3412; --outline:rgba(255,255,255,.28);}}
:root[data-theme=dark]{--page:#121212; --surface:#1e1e1e; --ink:#dedede; --muted:#9e9e9e; --faint:#7c7c7c; --rule:#333333; --primary:#9FA8DA; --primary-soft:#2a2d3c; --primary-ink:#c5cae9; --primary-line:#3d4260; --on-primary:#121212; --on-ink:#121212; --tag-bg:#262626; --ph:#2c2c2c; --ph-line:#444444; --hover-line:#4a4a4a; --hover-bg:#262626; --admin-bg:#181818; --warn-bg:#3a3112; --warn-ink:#f0d78c; --gold-soft:#332a10; --gold-line:#6b5a22; --gold-ink:#f0d78c; --gold-icon:#e0c060; --star-off:#4a4a4a; --ok:#81c784; --mock-bg:#3a3412; --mock-ink:#f0e2a0; --mock-line:#7a6a1a; --mock-note:#c9b870; --mock-on:#3a3412; --outline:rgba(255,255,255,.28);}
.seg,.gbar .t i,.gchip i,.legend i{box-shadow:inset 0 0 0 1px var(--outline)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 Roboto,system-ui,sans-serif}
a{color:var(--primary);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.viewas{background:var(--mock-bg);border-bottom:1px dashed var(--mock-line);font-size:13px;color:var(--mock-ink)}
.viewas .wrap{display:flex;gap:8px;align-items:center;min-height:36px;flex-wrap:wrap;padding-top:4px;padding-bottom:4px}
.viewas span.opt{padding:2px 10px;border-radius:999px;cursor:pointer}
.viewas span.opt.on{background:var(--mock-ink);color:var(--mock-on)}
.nav{background:var(--surface);border-bottom:1px solid var(--rule)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:60px}
.brand{font:700 19px 'Roboto Slab',serif;color:var(--primary)}
.nav a.m{color:var(--ink);font-size:15px}
.nav a.m.cur{color:var(--primary);font-weight:500}
.nav .m i{margin-right:6px;font-size:13px}
.navsearch{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:6px 12px;width:300px;color:var(--faint);font-size:14px}
.navsearch label{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.r-user,.r-admin{display:none}
body.user .r-user, body.admin .r-user, body.admin .r-admin{display:inline}
body.user .r-anon, body.admin .r-anon{display:none}
.rel{position:relative}
.anno{position:absolute;background:#FFE57A;color:#3a3000;font:600 12px Roboto;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:4}
.crumbs{font-size:13px;color:var(--faint);padding:18px 0 6px}
.crumbs a{color:var(--muted)}
h1{font:600 36px/1.15 'Roboto Slab',serif;margin:2px 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 14px;max-width:80ch}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--rule);padding:2px 0 2px 12px;max-width:80ch;margin:0 0 16px}
.chip{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;background:var(--primary-soft);color:var(--primary-ink)}
.facts{color:var(--muted);margin-top:12px}
.facts b{color:var(--ink);font-weight:500}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.box h3{font:600 14px 'Roboto Slab',serif;margin:0 0 8px}
.box ul{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:5px}
aside{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:8px;margin:28px 0 12px}
.sec-head h2{font:600 22px 'Roboto Slab',serif;margin:0}
.sec-head h2 small{font:400 14px Roboto;color:var(--faint);margin-left:8px}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface);font-size:13px}
.seg span{padding:6px 11px;color:var(--muted);border-left:1px solid var(--rule);cursor:pointer}
.seg span:first-child{border-left:0}
.seg span.on{background:var(--primary-soft);color:var(--primary);font-weight:500}
.years{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.yr{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:6px 14px;border-top:1px solid var(--rule)}
.yr:first-child{border-top:0}
.yr b{font:600 15px 'Roboto Slab',serif}
.yr .nums{display:flex;flex-wrap:wrap;gap:6px}
.yr .nums a{min-width:34px;text-align:center;border:1px solid var(--rule);border-radius:6px;padding:1px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.yr .nums a:hover{background:var(--primary-soft);text-decoration:none}
.yr small{color:var(--faint);font-size:12.5px}
.decade{font:600 14px 'Roboto Slab',serif;color:var(--muted);margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px}
.grid a{color:var(--ink);font-size:13px;text-align:center}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;display:block;margin-bottom:5px;box-shadow:0 1px 4px rgba(0,0,0,.25);background:var(--ph)}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;font-size:14.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
th i{font-size:11px;margin-left:4px;color:var(--faint)}
th.on{color:var(--primary)}
td{padding:8px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover-bg)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.y{color:var(--muted);white-space:nowrap}
td small{display:block;color:var(--faint);font-size:12.5px}
td.none{color:var(--faint);font-style:italic}
.filters{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.input{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:7px 12px;color:var(--faint);font-size:14.5px;min-width:260px;flex:1;max-width:420px}
.fchip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

.issue-head{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:start}
.issue-head img{width:200px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.25);display:block}
.mag{font:500 20px 'Roboto Slab',serif}
.people{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.people span{color:var(--muted)}
.pn{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-top:18px;font-size:14px;align-items:center}
.pn > *{padding:8px 14px}
.pn .mid{text-align:center;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.pn .next{text-align:right}
.pn small{display:block;color:var(--faint);font-size:12px}
.ctable{table-layout:fixed}
.ctable th:nth-child(1){width:52%}.ctable th:nth-child(2){width:28%}
.issue-head > div{min-width:0}
.typehead{font:600 15px 'Roboto Slab',serif;color:var(--muted);margin:16px 0 6px}
.fab{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:none;place-items:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
body.admin .fab{display:grid}
.foot{height:70px}

@media (max-width:900px){.layout{grid-template-columns:1fr}}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .nav a.m{display:none}
  .navsearch{width:auto;flex:1}
  h1{font-size:26px}
  .issue-head{grid-template-columns:110px 1fr;gap:16px}
  .issue-head img{width:110px}
  .yr{grid-template-columns:52px 1fr}
  .pn{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pn .mid{grid-column:1/-1;grid-row:1;border:0;border-bottom:1px solid var(--rule)}
  .yr small{display:none}
  .input{min-width:0;max-width:none;width:100%}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tr{padding:8px 14px;border-bottom:1px solid var(--rule)}
  td{border:0;padding:0}
  td.n,td.y{display:inline;font-size:13px;color:var(--muted);text-align:left}
  td.n::after{content:" numeroa · "}
  .anno{display:none}
}
</style>
</head>
<body>
<div class="viewas"><div class="wrap">Mockup:
  <span class="opt" data-v="list">Lehdet</span><span class="opt" data-v="mag">Lehti: Tähtivaeltaja</span><span class="opt" data-v="issue">Numero: Tähtivaeltaja 2/2000</span>
  <span style="margin-left:8px">Käyttäjä:</span><span class="opt" data-as="anon">Vierailija</span><span class="opt" data-as="admin">Ylläpitäjä</span>
  <span style="margin-left:8px">Teema:</span><span class="opt thm" data-th="light">Vaalea</span><span class="opt thm" data-th="dark">Tumma</span></div></div>
<header class="nav"><div class="wrap">
  <span class="brand">SuomiSF</span>
  <a class="m">Kirjat</a><a class="m cur">Lehdet</a><a class="m">Novellit</a>
  <a class="m r-anon">Hakemistot ▾</a><a class="m r-user">Muut ▾</a>
  <a class="m r-admin"><i class="pi pi-wrench"></i>Ylläpito ▾</a>
  <a class="m r-anon"><i class="pi pi-user"></i>Käyttäjätili ▾</a><a class="m r-user"><i class="pi pi-user"></i>mep ▾</a>
  <div class="navsearch"><i class="pi pi-search"></i>Etsi<label><input type="checkbox" checked> Vain nimet</label></div>
</div></header>
<div class="wrap" id="app"></div>
<div class="fab" title="Ylläpito">+</div>

<script src="magazines-data.js"></script>
<script>
const IMG="https://www.sf-bibliografia.fi:5000";
const Q=new URLSearchParams(location.search);
const V=Q.get("v")||"list";
let VIEW=Q.get("view")||"list";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=n=>n.toLocaleString("fi-FI");
// Current editor = the editor of the latest issue (Tähtivaeltaja 4/2025; real data)
const CURRENT_EDITOR={name:"Toni Jerrman",issue:"4/2025"};
const sp=s=>!s?"":s[0]===s[1]?""+s[0]:s[0]+"–"+s[1];

function listPage(){
  const L=MAG.list; const withIssues=L.filter(m=>m.n>0).length;
  return `<div class="crumbs">Lehdet</div>
  <section class="rel"><span class="anno" style="left:-34px;top:8px">1</span><h1>Lehdet</h1>
  <p class="lead">${L.length} suomalaista SF-fanzinea ja -lehteä, joista ${withIssues}:n numerot on luetteloitu.</p>
  <p class="note">Lehdistä on luetteloitu novellit ja artikkelit. Sarjakuvat puuttuvat, mutta ne on tarkoitus jossain vaiheessa lisätä. Vakiopalstoja, kuten pääkirjoitus-, uutis-, kirja-arvostelu-, elokuva- ja videopalstoja, ei ole yleensä listattu, elleivät ne ole sisältäneet pidempää artikkelia. Artikkelimuotoiset arvostelut on luetteloitu.</p></section>
  <section class="filters rel"><span class="anno" style="left:-50px;top:10px">2</span><span class="input"><i class="pi pi-search"></i>Hae lehden nimellä…</span>
    <span class="fchip on">Kaikki</span><span class="fchip">Fanzinet</span><span class="fchip">SF-lehdet</span><span class="fchip">Vain luetteloidut</span></section>
  <div class="rel"><span class="anno" style="left:-34px;top:12px">3</span><table><thead><tr><th class="on">Nimi<i class="pi pi-sort-amount-up-alt"></i></th><th>Tyyppi<i class="pi pi-sort-alt"></i></th><th>Ilmestyi<i class="pi pi-sort-alt"></i></th><th style="text-align:right">Numeroita<i class="pi pi-sort-alt"></i></th></tr></thead>
  <tbody>${L.map(m=>`<tr><td><a>${esc(m.name)}</a></td><td>${esc(m.type==="SF-lehdet"?"SF-lehti":m.type)}</td>
    ${m.n?`<td class="y">${sp(m.span)}</td><td class="n">${m.n}</td>`:`<td class="none" colspan="2">numeroita ei ole vielä luetteloitu</td>`}</tr>`).join("")}</tbody></table></div>
  <div class="foot"></div>`;
}

function magPage(){
  const M=MAG.mag; const is=[...M.issues].sort((a,b)=>a.y-b.y||(a.num||0)-(b.num||0));
  const years=[...new Set(is.map(i=>i.y))];
  const by=y=>is.filter(i=>i.y===y);
  // "2 / 1984" -> "2": the year is already the row label
  const short=i=>String(i.no||"").replace(/\s*\/\s*\d{4}\s*$/,"").trim()||i.no;
  return `<div class="crumbs"><a>Lehdet</a> / ${esc(M.name)}</div>
  <div class="layout"><main>
  <section class="rel"><span class="anno" style="left:-34px;top:6px">1</span>
    <h1>${esc(M.name)}</h1>
    <div><span class="chip">${esc(M.type)}</span></div>
    <div class="facts">Julkaisija <a>${esc(M.pub)}</a>. <b>${is.length} numeroa ${years[0]}–${years[years.length-1]}</b>.${M.issn?` ISSN ${esc(M.issn)}.`:""}</div>
    <div class="facts" style="margin-top:4px">Päätoimittaja <a>${esc(CURRENT_EDITOR.name)}</a> <span style="color:var(--faint)">(viimeisin numero ${esc(CURRENT_EDITOR.issue)})</span></div>
    ${M.desc?`<div class="note" style="margin-top:12px">${M.desc}</div>`:""}
  </section>
  <section class="rel"><span class="anno" style="left:-34px;top:30px">2</span>
    <div class="sec-head"><h2>Numerot<small>${is.length}</small></h2><span class="seg" id="view"><span data-w="list">Lista</span><span data-w="covers">Kannet</span></span></div>
    ${VIEW==="covers"?years.map(y=>`<div class="decade">${y}</div><div class="grid">${by(y).map(i=>`<a><img src="${IMG+i.img}" alt="" loading="lazy">${esc(short(i))}</a>`).join("")}</div>`).join("")
    :`<div class="years">${years.map(y=>`<div class="yr"><b>${y}</b><span class="nums">${by(y).map(i=>`<a title="${esc(M.name)} ${esc(i.no)}${i.title?": "+esc(i.title):""}">${esc(short(i))}</a>`).join("")}</span><small>${by(y).length} ${by(y).length>1?"numeroa":"numero"}</small></div>`).join("")}</div>`}
  </section></main>
  <aside class="rel"><span class="anno" style="left:-34px;top:4px">3</span>
    <div class="box"><h3>Linkit</h3><ul><li><a>Kotisivu</a> <span style="color:var(--faint);font-size:12.5px">${esc((M.link||"").replace(/^https?:\/\//,"").replace(/\/$/,""))}</span></li></ul></div>
    <div class="box"><h3>Sisältö</h3><ul><li><a>Kaikki lehden novellit ja artikkelit</a></li><li style="color:var(--muted);font-size:13px">Avaa novellihaun tällä lehdellä rajattuna.</li></ul></div>
  </aside></div><div class="foot"></div>`;
}

function issuePage(){
  const I=MAG.iss; const M=MAG.mag;
  const ed=I.contrib.filter(c=>c[0]==="Päätoimittaja").map(c=>c[1]), cover=I.contrib.filter(c=>c[0]==="Kansikuva").map(c=>c[1]);
  const sorted=[...M.issues].sort((a,b)=>a.y-b.y||(a.num||0)-(b.num||0));
  const prev=sorted.find(x=>x.id===I.prev), next=sorted.find(x=>x.id===I.next);
  const groups={};I.stories.forEach(s=>(groups[s.type]=groups[s.type]||[]).push(s));
  const order=["Novelli","Pitkä novelli","Pienoisromaani","Raapale","Runo","Artikkeli","Esipuhe","Jälkisanat"];
  const plural={"Novelli":"Novellit","Pitkä novelli":"Pitkät novellit","Pienoisromaani":"Pienoisromaanit","Raapale":"Raapaleet","Runo":"Runot","Artikkeli":"Artikkelit"};
  return `<div class="crumbs"><a>Lehdet</a> / <a>${esc(M.name)}</a> / ${esc(I.no)}</div>
  <section class="issue-head rel"><span class="anno" style="left:-34px;top:4px">1</span>
    <img src="${IMG+I.img[0]}" alt="Kansi: ${esc(M.name)} ${esc(I.no)}">
    <div><div class="mag"><a>${esc(M.name)}</a></div><h1>${esc(I.no)}</h1>${I.title?`<div class="facts">${esc(I.title)}</div>`:""}
      <div class="people">${ed.length?`<span>Päätoimittaja</span><div><a>${ed.map(esc).join(", ")}</a></div>`:""}${cover.length?`<span>Kansikuva</span><div><a>${cover.map(esc).join(", ")}</a></div>`:""}
      ${I.pages?`<span>Sivuja</span><div>${I.pages}${I.size?`, ${esc(I.size)}`:""}</div>`:""}</div>
      <div class="pn rel"><span class="anno" style="right:-34px;top:8px">2</span><div>${prev?`<small>‹ Edellinen</small><a>${esc(prev.no)}</a>`:""}</div><div class="mid"><a>Kaikki numerot</a></div><div class="next">${next?`<small>Seuraava ›</small><a>${esc(next.no)}</a>`:""}</div></div>
    </div>
  </section>
  <section class="rel"><span class="anno" style="left:-34px;top:30px">3</span>
    <div class="sec-head"><h2>Sisältö<small>${I.stories.length}</small></h2></div>
    ${order.filter(t=>groups[t]).map(t=>`<div class="typehead">${plural[t]||t} (${groups[t].length})</div>
    <table class="ctable"><thead><tr><th>Nimi</th><th>Kirjoittaja</th><th>Suomentaja</th></tr></thead><tbody>
    ${groups[t].map(s=>`<tr><td><a>${esc(s.title)}</a>${s.orig?`<small>${esc(s.orig)}${s.y?" "+s.y:""}</small>`:s.y&&s.y!==I.y?`<small>${s.y}</small>`:""}</td><td><a>${s.au.map(esc).join(", ")}</a></td><td>${s.tr.map(esc).join(", ")}</td></tr>`).join("")}
    </tbody></table>`).join("")}
  </section><div class="foot"></div>`;
}

function render(){
  document.getElementById("app").innerHTML=V==="mag"?magPage():V==="issue"?issuePage():listPage();
  document.querySelectorAll("#view span").forEach(x=>{x.classList.toggle("on",x.dataset.w===VIEW);x.onclick=()=>{VIEW=x.dataset.w;render()}});
}
render();
document.querySelectorAll(".viewas .opt[data-v]").forEach(x=>{x.classList.toggle("on",x.dataset.v===V);x.onclick=()=>{const u=new URLSearchParams(location.search);u.set("v",x.dataset.v);u.delete("view");location.search=u}});
const setAs=a=>{document.body.classList.remove("anon","user","admin");document.body.classList.add(a);document.querySelectorAll(".viewas .opt[data-as]").forEach(x=>x.classList.toggle("on",x.dataset.as===a))};
document.querySelectorAll(".viewas .opt[data-as]").forEach(x=>x.onclick=()=>setAs(x.dataset.as));setAs(Q.get("as")||"anon");
(()=>{const set=t=>{if(t)document.documentElement.dataset.theme=t;document.querySelectorAll(".viewas .thm").forEach(x=>x.classList.toggle("on",x.dataset.th===document.documentElement.dataset.theme))};
document.querySelectorAll(".viewas .thm").forEach(x=>x.onclick=()=>set(x.dataset.th));set(Q.get("theme"));})();
