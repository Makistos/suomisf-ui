<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login and FAQ mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.css">
<style>
:root{
  --page:#F3F4F8; --surface:#FFFFFF; --ink:#1E2233; --muted:#5D6377; --faint:#8A90A3;
  --rule:#E3E6EE; --primary:#3F51B5; --primary-soft:#E8EBF8; --primary-ink:#2D3A8C;
  --sf:#0958D7; --f:#31572C; --k:#D30031; --kok:#008B8B; --other:#6C757D;
  --primary-ink:#2D3A8C; --primary-line:#CDD3F0; --on-primary:#fff; --on-ink:#fff; --tag-bg:#FAFBFD; --ph:#E3E6EE; --ph-line:#D3D7E2; --hover-line:#C9CEE0; --hover-bg:#F8F9FC; --admin-bg:#F7F8FB; --warn-bg:#FFF8E6; --warn-ink:#6B5310; --gold-soft:#FBF3DC; --gold-line:#EBD9A5; --gold-ink:#4A3A0A; --gold-icon:#8A6A12; --star-off:#C9CEDB; --ok:#2E7D4F; --mock-bg:#FFF7D6; --mock-ink:#5A4B0F; --mock-line:#D9C56B; --mock-note:#8A7A3A; --mock-on:#fff; --outline:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--page:#121212; --surface:#1e1e1e; --ink:#dedede; --muted:#9e9e9e; --faint:#7c7c7c; --rule:#333333; --primary:#9FA8DA; --primary-soft:#2a2d3c; --primary-ink:#c5cae9; --primary-line:#3d4260; --on-primary:#121212; --on-ink:#121212; --tag-bg:#262626; --ph:#2c2c2c; --ph-line:#444444; --hover-line:#4a4a4a; --hover-bg:#262626; --admin-bg:#181818; --warn-bg:#3a3112; --warn-ink:#f0d78c; --gold-soft:#332a10; --gold-line:#6b5a22; --gold-ink:#f0d78c; --gold-icon:#e0c060; --star-off:#4a4a4a; --ok:#81c784; --mock-bg:#3a3412; --mock-ink:#f0e2a0; --mock-line:#7a6a1a; --mock-note:#c9b870; --mock-on:#3a3412; --outline:rgba(255,255,255,.28);}}
:root[data-theme=dark]{--page:#121212; --surface:#1e1e1e; --ink:#dedede; --muted:#9e9e9e; --faint:#7c7c7c; --rule:#333333; --primary:#9FA8DA; --primary-soft:#2a2d3c; --primary-ink:#c5cae9; --primary-line:#3d4260; --on-primary:#121212; --on-ink:#121212; --tag-bg:#262626; --ph:#2c2c2c; --ph-line:#444444; --hover-line:#4a4a4a; --hover-bg:#262626; --admin-bg:#181818; --warn-bg:#3a3112; --warn-ink:#f0d78c; --gold-soft:#332a10; --gold-line:#6b5a22; --gold-ink:#f0d78c; --gold-icon:#e0c060; --star-off:#4a4a4a; --ok:#81c784; --mock-bg:#3a3412; --mock-ink:#f0e2a0; --mock-line:#7a6a1a; --mock-note:#c9b870; --mock-on:#3a3412; --outline:rgba(255,255,255,.28);}
.seg,.gbar .t i,.gchip i,.legend i{box-shadow:inset 0 0 0 1px var(--outline)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 Roboto,system-ui,sans-serif}
a{color:var(--primary);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.viewas{background:var(--mock-bg);border-bottom:1px dashed var(--mock-line);font-size:13px;color:var(--mock-ink)}
.viewas .wrap{display:flex;gap:8px;align-items:center;min-height:36px;flex-wrap:wrap;padding-top:4px;padding-bottom:4px}
.viewas span.opt{padding:2px 10px;border-radius:999px;cursor:pointer}
.viewas span.opt.on{background:var(--mock-ink);color:var(--mock-on)}
.nav{background:var(--surface);border-bottom:1px solid var(--rule)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:60px}
.brand{font:700 19px 'Roboto Slab',serif;color:var(--primary)}
.nav a.m{color:var(--ink);font-size:15px}
.nav .m i{margin-right:6px;font-size:13px}
.navsearch{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:6px 12px;width:300px;color:var(--faint);font-size:14px}
.navsearch label{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.rel{position:relative}
.anno{position:absolute;background:#FFE57A;color:#3a3000;font:600 12px Roboto;border-radius:999px;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:4}
.crumbs{font-size:13px;color:var(--faint);padding:18px 0 6px}
.crumbs a{color:var(--muted)}
h1{font:600 36px/1.15 'Roboto Slab',serif;margin:2px 0 6px;letter-spacing:-.01em}

/* auth */
.authwrap{display:flex;justify-content:center;padding:48px 0 80px}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:28px 28px 24px}
.card h1{font-size:28px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:14.5px;margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.field label{font-size:14px;font-weight:500}
.field .in{border:1px solid var(--rule);border-radius:8px;padding:9px 12px;font-size:15px;color:var(--ink);background:var(--surface);min-height:40px;display:flex;align-items:center;justify-content:space-between}
.field .in.err{border-color:#c0392b}
.field .in i{color:var(--faint)}
.field .hint{font-size:13px;color:var(--faint)}
.field .msg{font-size:13px;color:#c0392b}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:-4px 0 18px}
.btn{width:100%;border:0;border-radius:8px;padding:11px 14px;font:500 15px Roboto;background:var(--primary);color:var(--on-primary);cursor:pointer}
.alt{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:16px}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:16px;border:1px solid var(--rule);background:var(--hover-bg)}
.alert.ok{border-color:transparent;background:var(--primary-soft);color:var(--primary-ink)}

/* faq */
.faq{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;margin-top:12px}
.toc{position:sticky;top:16px;align-self:start;font-size:14.5px;display:flex;flex-direction:column;gap:2px}
.toc b{font:600 14px 'Roboto Slab',serif;margin-bottom:6px}
.toc a{color:var(--muted);padding:5px 10px;border-left:2px solid var(--rule)}
.toc a.on{color:var(--primary);border-left-color:var(--primary);font-weight:500}
.qa{max-width:72ch}
.qa section{padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.qa section:last-child{border-bottom:0}
.qa h2{font:600 21px/1.3 'Roboto Slab',serif;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.qa h2 a.perm{font:400 14px Roboto;color:var(--faint);opacity:.0}
.qa h2:hover a.perm{opacity:1}
.qa p{margin:0 0 12px}
.qa dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;margin:0 0 12px;font-size:15px}
.qa dt{font-weight:500}
.qa dd{margin:0;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 4px;max-width:72ch}
.foot{height:60px}

@media (max-width:760px){
  .wrap{padding:0 16px}
  .nav a.m{display:none}
  .navsearch{width:auto;flex:1}
  h1{font-size:28px}
  .authwrap{padding:24px 0 48px}
  .card{padding:22px 18px}
  .faq{grid-template-columns:1fr;gap:16px}
  .toc{position:static;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--surface)}
  .qa dl{grid-template-columns:1fr}
  .anno{display:none}
}
</style>
</head>
<body>
<div class="viewas"><div class="wrap">Mockup:
  <span class="opt" data-v="login">Kirjaudu</span><span class="opt" data-v="register">Luo tunnus</span><span class="opt" data-v="forgot">Unohtunut salasana</span><span class="opt" data-v="faq">Tietoja sivustosta</span>
  <span style="margin-left:8px">Teema:</span><span class="opt thm" data-th="light">Vaalea</span><span class="opt thm" data-th="dark">Tumma</span></div></div>
<header class="nav"><div class="wrap">
  <span class="brand">SuomiSF</span>
  <a class="m">Kirjat</a><a class="m">Lehdet</a><a class="m">Novellit</a><a class="m">Hakemistot ▾</a>
  <a class="m"><i class="pi pi-user"></i>Käyttäjätili ▾</a>
  <div class="navsearch"><i class="pi pi-search"></i>Etsi<label><input type="checkbox" checked> Vain nimet</label></div>
</div></header>
<div class="wrap" id="app"></div>

<script>
const Q=new URLSearchParams(location.search);
const V=Q.get("v")||"login";

const login=()=>`<div class="authwrap"><div class="card rel"><span class="anno" style="left:-40px;top:24px">1</span>
  <h1>Kirjaudu</h1><p class="sub">Kirjautuneena voit merkitä omistamasi ja lukemasi kirjat ja pitää muistilistaa.</p>
  <div class="alert">Kirjaudu sisään, niin palaat sivulle <b>Linnunradan käsikirja liftareille</b>.</div>
  <div class="field"><label>Käyttäjätunnus</label><div class="in"></div></div>
  <div class="field"><label>Salasana</label><div class="in"><span></span><i class="pi pi-eye"></i></div></div>
  <button class="btn">Kirjaudu</button>
  <div class="alt rel"><span class="anno" style="left:-68px;top:-2px">2</span><a>Unohtuiko salasana?</a><span>Ei tunnusta? <a>Luo tunnus</a></span></div></div></div>`;

const register=()=>`<div class="authwrap"><div class="card rel"><span class="anno" style="left:-40px;top:24px">3</span>
  <h1>Luo tunnus</h1><p class="sub">Tunnus on maksuton. Sillä voit merkitä kokoelmasi, luetut ja muistilistan; ne näkyvät kaikille profiilissasi.</p>
  <div class="field"><label>Käyttäjätunnus</label><div class="in">kirjafani</div><span class="hint">Näkyy muille käyttäjille.</span></div>
  <div class="field"><label>Sähköposti <span style="font-weight:400;color:var(--faint)">(valinnainen)</span></label><div class="in"></div><span class="hint">Vain salasanan palauttamiseen; ei näy muille.</span></div>
  <div class="field"><label>Salasana</label><div class="in err"><span>••••••</span><i class="pi pi-eye"></i></div><span class="msg">Vähintään 8 merkkiä.</span></div>
  <div class="field"><label>Salasana uudestaan</label><div class="in"><span></span><i class="pi pi-eye"></i></div></div>
  <button class="btn">Luo tunnus</button>
  <div class="alt"><span>Onko sinulla jo tunnus? <a>Kirjaudu</a></span></div></div></div>`;

const forgot=()=>`<div class="authwrap"><div class="card rel"><span class="anno" style="left:-40px;top:24px">4</span>
  <h1>Unohtunut salasana</h1><p class="sub">Lähetämme palautuslinkin tunnukseen liitettyyn sähköpostiin.</p>
  <div class="alert ok"><i class="pi pi-check"></i> Jos osoitteelle on tunnus, linkki on lähetetty. Linkki on voimassa tunnin.</div>
  <div class="field"><label>Sähköposti</label><div class="in"></div></div>
  <button class="btn">Lähetä palautuslinkki</button>
  <div class="alt"><a>‹ Takaisin kirjautumiseen</a></div>
  <p class="sub" style="margin:16px 0 0;font-size:13px">Eikö tunnukseen ole liitetty sähköpostia? Ota yhteyttä: yp (at) sf-bibliografia.fi.</p></div></div>`;

const QA=[
 ["sivusto","Mikä tämä sivusto on?",`<p>Suomenkielisen spekulatiivisen fiktion bibliografia. Tavoitteena on luetteloida kaikki suomeksi julkaistu tieteis-, fantasia- ja kauhukirjallisuus sekä tiedot suomalaisista SF-fanzineista: kirjat painoksineen, novellit, lehdet, henkilöt, sarjat ja palkinnot.</p>`],
 ["lahteet","Mistä sivuston tiedot tulevat?",`<p>Suurin osa kirjoista tulee alkuperäisestä kirjaluettelosta. Sen tietoja on laajennettu ja uudet kirjat lisätty käyttäen hyväksi omia kokoelmia sekä erityisesti <a>Kansalliskirjastoa</a> (perustiedot kuten ISBN), <a>Risingshadow'ta</a> (teosten kuvaukset) ja <a>Kirjasampoa</a> (asiasanat). Näiden lisäksi lukuisia muita lähteitä on käytetty tarpeen mukaan.</p>
   <p>Kansikuvat löytyvät pääasiassa eri sivustoilta, kuten Antikvaarista, Kansalliskirjastosta (uudempien kirjojen osalta) ja Risingshadow'sta. Runsaasti kuvia on myös skannattu itse omista kirjoista.</p>
   <p>Henkilöiden kuvat on haettu Wikipedia-, Wikimedia Commons- ja Wikidata-sivustoilta. Kuvina käytetään vain sellaisia, joiden lisenssi sallii uudelleenkäytön. Lisenssin ja kuvan ottajan näkee kuvan alta.</p>`],
 ["virheet","Sivustolla on virhe tai puutteita!",`<p>Ihan varmasti. Pyrimme mahdollisimman suureen tarkkuuteen, mutta ellemme itse omista tiettyä kirjaa, olemme muiden kokoamien tietojen varassa. Jopa Kansalliskirjaston tiedoissa on virheitä, ja sieltä puuttuu runsaasti painoksia.</p>
   <p>Sekä toiminnallisista että sisällöllisistä virheistä voi ilmoittaa sähköpostilla osoitteeseen yp (at) sf-bibliografia.fi.</p>`],
 ["sidonta","Mitä eroa on sidotulla ja nidotulla kirjalla?",`<dl><dt>Sidottu</dt><dd>Kovakantinen kirja.</dd><dt>Nidottu</dt><dd>Pehmytkantinen kirja.</dd></dl>`],
 ["kannet","Mitä ovat ylivetokansi ja kansipaperi?",`<dl><dt>Ylivetokansi</dt><dd>Kovakantisen kirjan kanteen painettu kuva. Pehmytkantisissa tämä on niin yleistä, ettei sitä mainita erikseen.</dd><dt>Kansipaperi</dt><dd>Kovakantiseen kirjaan lisätty erillinen, irrallinen suojakansi.</dd></dl>
   <p>Näiden tietojen osalta sivusto on varsin puutteellinen, koska tietoja ei ole aina tarjolla.</p>`],
 ["laitos","Mitä eroa on laitoksella ja painoksella?",`<dl><dt>Painos</dt><dd>Yksi kerralla painettu sarja kirjoja.</dd><dt>Laitos</dt><dd>Uusi laitos syntyy, kun teoksen sisältö muuttuu: vaihtunut kustantaja, kääntäjä tai lisätty kuvitus.</dd></dl>
   <p>Käytännössä asia ei ole aina yhtä yksinkertainen. Kustantajat jättävät yhä useammin painostiedon pois, joten painoksen numeroa joudutaan usein arvaamaan, ja eri kustantajat ovat numeroineet laitosten painokset eri tavoin. Kirjoissa olevia laitos- ja painostietoja noudatetaan aina, Kansalliskirjaston tietoja lähes aina.</p>`],
 ["tekniikka","Millä sivusto on tehty?",`<p>Käyttöliittymä on tehty TypeScriptillä <a>React</a>-ympäristöön, komponenttikirjastona <a>PrimeReact</a>. Taustajärjestelmä on tehty Pythonilla <a>Flask</a>-ympäristöön. Ikonit ovat <a>IconArchive</a>-palvelusta.</p>
   <p>Kaikki koodi on vapaata: <a>käyttöliittymä</a> ja <a>taustajärjestelmä</a> GitHubissa.</p>`]];

const faq=()=>`<div class="crumbs"><a>Etusivu</a> / Tietoja sivustosta</div>
  <h1>Tietoja sivustosta</h1><p class="lead">Usein kysyttyä: mistä tiedot tulevat, mitä termit tarkoittavat ja miten virheistä ilmoitetaan.</p>
  <div class="faq"><nav class="toc rel"><span class="anno" style="left:-34px;top:0">5</span><b>Kysymykset</b>${QA.map(([id,q],i)=>`<a class="${i===5?"on":""}">${q}</a>`).join("")}</nav>
  <div class="qa rel"><span class="anno" style="left:-34px;top:2px">6</span>${QA.map(([id,q,a])=>`<section id="${id}"><h2>${q}<a class="perm">#</a></h2>${a}</section>`).join("")}</div></div><div class="foot"></div>`;

document.getElementById("app").innerHTML=V==="register"?register():V==="forgot"?forgot():V==="faq"?faq():login();
document.querySelectorAll(".viewas .opt[data-v]").forEach(x=>{x.classList.toggle("on",x.dataset.v===V);x.onclick=()=>{const u=new URLSearchParams(location.search);u.set("v",x.dataset.v);location.search=u}});
(()=>{const set=t=>{if(t)document.documentElement.dataset.theme=t;document.querySelectorAll(".viewas .thm").forEach(x=>x.classList.toggle("on",x.dataset.th===document.documentElement.dataset.theme))};
document.querySelectorAll(".viewas .thm").forEach(x=>x.onclick=()=>set(x.dataset.th));set(Q.get("theme"));})();
</script>
</body>
</html>
