<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="utf-8" />
  <!-- Cascade layer order, before any stylesheet: the site's base link
       styles (App.css) lose to PrimeReact's layered theme and component
       styles. Layer order follows first mention, and the theme links below
       declare @layer primereact. -->
  <style>@layer suomisf-base, primereact;</style>
  <link rel="icon" href="/favicon.ico" />

  <!-- <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
  <link rel="stylesheet" href="https://unpkg.com/primereact/resources/themes/bootstrap4-light-blue/theme.css" />
  <link rel="stylesheet" href="https://unpkg.com/primereact/resources/primereact.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/primeflex@2.0.0/primeflex.min.css" /> -->
  <!--
      Theme by system colour scheme. Static links with media queries are
      render-blocking (the script that used to set the href was not, so the
      page painted unstyled first and then jumped) and switch live when the
      system setting changes, with no JavaScript.
      Served from our own build (the installed primereact package, with the
      Roboto files the theme references) rather than cdnjs, so the site
      doesn't need a third party to render. PrimeIcons and Roboto Slab are
      imported in src/index.tsx.
    -->
  <link rel="stylesheet" media="(prefers-color-scheme: light)"
    href="./node_modules/primereact/resources/themes/mdc-light-indigo/theme.css" />
  <link rel="stylesheet" media="(prefers-color-scheme: dark)"
    href="./node_modules/primereact/resources/themes/mdc-dark-indigo/theme.css" />
  <!-- <link rel="stylesheet" href="%PUBLIC_URL%/primeicons/primeicons.css" />
  <link id="theme-link" rel="stylesheet" href="%PUBLIC_URL%/resources/themes/bootstrap4-light-blue/theme.css">
  <link rel="stylesheet" href="%PUBLIC_URL%/resources/primereact.min.css" /> -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="SF-Bibliografia" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>SF-Bibliografia</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
